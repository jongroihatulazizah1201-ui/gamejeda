<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEDA - Latihan Berhenti Sejenak</title>
  <!-- Favicon Logo Resmi JEDA (Zen Pause Emblem) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23132832' stroke='%237FE0C3' stroke-width='3'/%3E%3Crect x='22' y='18' width='7' height='28' rx='3.5' fill='%237FE0C3'/%3E%3Crect x='35' y='18' width='7' height='28' rx='3.5' fill='%237FE0C3'/%3E%3C/svg%3E">
  <!-- Style CSS lokal dengan @font-face Nunito (woff2 lokal) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Container Pembungkus Utama (Modern Flexbox Wrapper) -->
  <div id="app-wrapper" class="game-wrapper">
    <!-- Panggung 3D Three.js di latar belakang (PRD Bagian 13) -->
    <div id="stage3d"></div>

    <!-- Induk Game Phaser 2D di lapisan atas transparan (Responsif Terpusat) -->
    <div id="game-container" class="game-container"></div>
  </div>

  <!-- Urutan pemuatan script sesuai PRD Bagian 14.6:
       phaser -> three -> config -> data -> state -> score -> guard -> stage3d -> layout -> fx -> ui -> scenes/* -> main -->
  <script src="lib/phaser.min.js"></script>
  <script src="lib/three.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/score.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/stage3d.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lumi.js"></script>
  
  <!-- Scenes -->
  <script src="js/scenes/boot.js"></script>
  <script src="js/scenes/checkin.js"></script>
  <script src="js/scenes/level1.js"></script>
  <script src="js/scenes/level2.js"></script>
  <script src="js/scenes/level3.js"></script>
  <script src="js/scenes/result.js"></script>
  <script src="js/scenes/pause.js"></script>

  <!-- Inisialisasi Game -->
  <script src="js/main.js"></script>
</body>
</html>
