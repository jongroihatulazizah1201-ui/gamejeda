<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEDA - Latihan Berhenti Sejenak</title>
  <!-- Style CSS lokal dengan @font-face Nunito (woff2 lokal) -->
  <link rel="stylesheet" href="css/style.css?v=2.1">
</head>
<body>
  <!-- Container Pembungkus Utama (Modern Flexbox Wrapper) -->
  <div id="app-wrapper" class="game-wrapper">
    <!-- Panggung 3D Three.js di latar belakang (PRD Bagian 13) -->
    <div id="stage3d"></div>

    <!-- Induk Game Phaser 2D di lapisan atas transparan (Responsif Terpusat) -->
    <div id="game-container" class="game-container"></div>
  </div>

  <!-- Urutan pemuatan script sesuai PRD Bagian 14.6:
       phaser -> three -> config -> data -> state -> score -> guard -> stage3d -> layout -> fx -> ui -> scenes/* -> main -->
  <script src="lib/phaser.min.js"></script>
  <script src="lib/three.min.js"></script>
  <script src="js/config.js?v=2.1"></script>
  <script src="js/data.js?v=2.1"></script>
  <script src="js/journal.js?v=2.1"></script>
  <script src="js/state.js?v=2.1"></script>
  <script src="js/score.js?v=2.1"></script>
  <script src="js/guard.js?v=2.1"></script>
  <script src="js/stage3d.js?v=2.1"></script>
  <script src="js/layout.js?v=2.1"></script>
  <script src="js/fx.js?v=2.1"></script>
  <script src="js/audio.js?v=2.1"></script>
  <script src="js/ui.js?v=2.1"></script>
  <script src="js/lumi.js?v=2.1"></script>
  
  <!-- Scenes -->
  <script src="js/scenes/boot.js?v=2.1"></script>
  <script src="js/scenes/checkin.js?v=2.1"></script>
  <script src="js/scenes/level1.js?v=2.1"></script>
  <script src="js/scenes/level2.js?v=2.1"></script>
  <script src="js/scenes/level3.js?v=2.1"></script>
  <script src="js/scenes/result.js?v=2.1"></script>
  <script src="js/scenes/pause.js?v=2.1"></script>

  <!-- Inisialisasi Game -->
  <script src="js/main.js?v=2.1"></script>
</body>
</html>
