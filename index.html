<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEDA - Latihan Berhenti Sejenak</title>
  <!-- SEO & Browser Meta -->
  <meta name="description" content="JEDA: Game interaktif micro-mindfulness untuk melatih pernapasan ritmik, defusi kognitif, dan respons sadar metode S.T.O.P. Berhenti sejenak, pulihkan ketenangan.">
  <meta name="theme-color" content="#16163A">
  <meta name="robots" content="index, follow">
  <!-- Style CSS Minified dengan @font-face Nunito (woff2 lokal) -->
  <link rel="stylesheet" href="dist/css/style.min.css?v=2.8">
</head>
<body>
  <!-- Container Pembungkus Utama (Semantic Main Landmark untuk Aksesibilitas) -->
  <main id="app-wrapper" class="game-wrapper" role="main" aria-label="Game JEDA Latihan Berhenti Sejenak">
    <!-- Header Brand Semantik (LCP Candidate & Screen Reader Hero) -->
    <header class="game-hero-brand" id="game-brand">
      <h1 class="brand-title">JEDA</h1>
      <p class="brand-tagline">Latihan Berhenti Sejenak — Micro-Mindfulness Interaktif</p>
    </header>

    <!-- Panggung 3D Three.js di latar belakang (PRD Bagian 13) -->
    <div id="stage3d" aria-hidden="true"></div>

    <!-- Induk Game Phaser 2D di lapisan atas transparan (Role region untuk validitas atribut ARIA) -->
    <div id="game-container" class="game-container" role="region" aria-label="Area Interaktif Game JEDA"></div>
  </main>

  <!-- Urutan pemuatan script non-blocking:
       1. Vendor Phaser 2D Engine
       2. Vendor Three.js 3D Engine (Latar belakang ambient)
       3. Bundle Aplikasi Minified JEDA (Semua modul, UI, stage3d, scenes, & inisialisasi) -->
  <script defer src="lib/phaser.min.js"></script>
  <script defer src="lib/three.min.js"></script>
  <script defer src="dist/js/app.min.js?v=2.8"></script>
</body>
</html>
